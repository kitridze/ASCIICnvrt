[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-art-studio"
version = "1.0.0"
description = "Convert images to ASCII art (PNG, JPEG, TXT) with a Qt GUI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ascii", "ascii-art", "image", "converter", "qt", "pyside6"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = ["PySide6>=6.5", "Pillow>=10.1", "numpy>=1.24"]

[project.gui-scripts]
ascii-art-studio = "ascii_art_studio.gui:main"

[tool.setuptools]
packages = ["ascii_art_studio"]   # explicit: keeps tests/ and data/ out of the wheel
